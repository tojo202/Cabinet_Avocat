name: CI/CD Pipeline Workflow

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests (Laravel & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: cabinet_test
          POSTGRES_USER: cabinet_user
          POSTGRES_PASSWORD: cabinet_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./cabinet-back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, bcmath, xml, zip
          coverage: none

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Database Migrations & Seeds on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: cabinet_test
          DB_USERNAME: cabinet_user
          DB_PASSWORD: cabinet_password
        run: php artisan migrate:fresh --seed --force

      - name: Execute Backend Tests via PHPUnit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: cabinet_test
          DB_USERNAME: cabinet_user
          DB_PASSWORD: cabinet_password
        run: php artisan test

  frontend-build:
    name: Frontend Build & Typecheck (React & Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./cabinet-front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: cabinet-front/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck & Production Build
        run: npm run build

